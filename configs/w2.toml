[agent]
model = "claude-haiku-4-5"        # LiteLLM model string
max_parse_retries = 2
max_revisions = 2
cache_dir = "data/llm_cache"

[run]
env = { n_boxes = 4, n_shelves = 3, max_steps = 40 }   # = WM training config
n_episodes = 100
seed = 11
arms = ["ungated", "always_check"]
wm_checkpoint = "data/wm/ensemble.pt"
out_dir = "data/agent"
